# Permalinks
#
# Use of `relative_permalinks` ensures post links from the index work properly.
permalink:           pretty

# Setup
title:               Nicholas Frechette's Blog
tagline:             'Raw bits'
description:         'A space to explore software ideas.'
url:                 https://nfrechette.github.io
baseurl:             ''
paginate:            5

# About/contact
author:
  name:              Nicholas Frechette
  url:               https://nfrechette.github.io
  email:             zeno490@gmail.com
  twitter:           nfrechette6

# Used by jekyll-seo-tag for the Twitter card and the JSON-LD author data
twitter:
  username:          nfrechette6
social:
  name:              Nicholas Frechette
  links:
    - https://x.com/nfrechette6
    - https://github.com/nfrechette
    - https://www.linkedin.com/in/nicholas-frechette-5b75461
logo:                /public/apple-touch-icon-precomposed.png

# Front matter defaults
# The site icon is the default social card image. It is small, so the card is the small "summary" card.
# A post with its own image sets "image:" and "twitter: card: summary_large_image".
defaults:
  -
    scope:
      path:          ''
    values:
      image:         /public/apple-touch-icon-precomposed.png
      twitter:
        card:        summary

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

# Overrides Jekyll's default list, so keep Gemfile/Gemfile.lock here
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - serve.sh
