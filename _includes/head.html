<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- The page has a light and a dark appearance. The browser uses this for scroll bars and other controls. -->
  <meta name="color-scheme" content="light dark">

  <title>
    {% if page.title == "Home" %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <!-- Description, canonical URL, Open Graph, Twitter card, and JSON-LD. The title above stays. -->
  {% seo title=false %}

  <!-- CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/poole.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/syntax.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/lanyon.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/dark.css" media="screen and (prefers-color-scheme: dark)">

  <!-- Fonts: the body text and the headings use these 2 fonts on each page. lanyon.css loads the other styles. -->
  <link rel="preload" href="{{ site.baseurl }}/public/fonts/pt-serif-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ site.baseurl }}/public/fonts/pt-sans-400.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Icons -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ site.baseurl }}/public/apple-touch-icon-precomposed.png">
  <link rel="shortcut icon" href="{{ site.baseurl }}/public/favicon.ico">

  <!-- Feed -->
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ site.url }}{{ site.baseurl }}/atom.xml">
</head>
